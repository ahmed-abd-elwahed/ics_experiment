[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "ics-experiment"
version = "0.2.0"
description = "Experiments comparing information gathering strategies against a simulated patient environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "respx>=0.21,<1",
  "mypy>=1.10,<3",
  "ruff>=0.5,<1",
]

[project.scripts]
medsim = "medsim.cli:main"
ics-experiment = "experiment.cli:console_main"
ics-webapp = "webapp.server:main"

# The environment's packages live under environment/ and install as top-level "medsim" and
# "bench", next to the experiment's own packages.
[tool.hatch.build.targets.wheel]
packages = ["environment/medsim", "environment/bench", "experiment", "strategies", "webapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "environment"]
markers = ["live: hits real external APIs (requires --live and OPENROUTER_API_KEY)"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "environment"
files = ["environment/medsim", "environment/bench", "experiment", "strategies", "webapp", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["respx", "respx.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "environment"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"environment/bench/**" = ["RUF001"]  # report labels use typographic dashes and signs on purpose
"environment/results/scripts/**" = ["RUF001"]
