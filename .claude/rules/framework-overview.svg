<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1728 776" role="img" aria-labelledby="t d" font-family="'DM Sans', system-ui, sans-serif" font-size="28" font-weight="500" fill="#141413">
  <title id="t">Framework overview</title>
  <desc id="d">An information gathering strategy sends queries to an LLM inside a simulated environment. The LLM consults the case study and the literature, and returns answers.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 Z" fill="#141413"/>
    </marker>

    <!-- Robot, centred on 0,0. The torso takes the `color` of the <use>. -->
    <g id="robot" stroke="#141413" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="-127" x2="0" y2="-104"/>
      <circle cx="0" cy="-136" r="9" fill="#FFFFFF"/>
      <rect x="-48" y="-104" width="96" height="72" rx="16" fill="#FFFFFF"/>
      <circle cx="-20" cy="-68" r="11" fill="#FFFFFF"/>
      <circle cx="20" cy="-68" r="11" fill="#FFFFFF"/>
      <circle cx="-20" cy="-68" r="4" fill="#141413" stroke="none"/>
      <circle cx="20" cy="-68" r="4" fill="#141413" stroke="none"/>
      <rect x="-14" y="-32" width="28" height="12" fill="#FFFFFF"/>
      <path d="M-60,0 H-86 V-40" fill="none"/>
      <path d="M-100,-58 a14,14 0 0 0 28,0" fill="none"/>
      <path d="M60,0 H86 V44" fill="none"/>
      <path d="M72,62 a14,14 0 0 1 28,0" fill="none"/>
      <rect x="-60" y="-20" width="120" height="100" rx="8" fill="currentColor"/>
      <polyline points="-44,30 -24,30 -12,8 2,52 14,22 24,30 44,30" fill="none"/>
      <rect x="-82" y="88" width="164" height="48" rx="24" fill="#FFFFFF"/>
      <circle cx="-44" cy="112" r="6" fill="#141413" stroke="none"/>
      <circle cx="0" cy="112" r="6" fill="#141413" stroke="none"/>
      <circle cx="44" cy="112" r="6" fill="#141413" stroke="none"/>
    </g>
  </defs>

  <!-- Simulated environment -->
  <rect x="24" y="72" width="820" height="680" rx="24" fill="#ECEDEE" stroke="#141413" stroke-width="3" stroke-dasharray="14 12"/>
  <rect x="254" y="49" width="360" height="46" rx="12" fill="#FCE5B4" stroke="#141413" stroke-width="2"/>
  <text x="434" y="82" text-anchor="middle">Simulated environment</text>

  <!-- Case study -->
  <rect x="95" y="122" width="190" height="46" rx="12" fill="#FCE5B4" stroke="#141413" stroke-width="2"/>
  <text x="190" y="155" text-anchor="middle">Case study</text>
  <g stroke="#141413" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130,192 H218 L250,224 V342 H130 Z" fill="#C9C8E0"/>
    <path d="M218,192 V224 H250" fill="#FFFFFF"/>
    <path d="M152,248 H190 M152,272 H228 M152,296 H228 M152,320 H228" fill="none"/>
  </g>

  <!-- The literature -->
  <rect x="65" y="478" width="250" height="46" rx="12" fill="#FCE5B4" stroke="#141413" stroke-width="2"/>
  <text x="190" y="511" text-anchor="middle">The literature</text>
  <line x1="222" y1="642" x2="262" y2="682" stroke="#141413" stroke-width="24" stroke-linecap="round"/>
  <line x1="222" y1="642" x2="262" y2="682" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <circle cx="180" cy="600" r="54" fill="#B3DFE2" stroke="#141413" stroke-width="3"/>

  <!-- LLM -->
  <rect x="572" y="200" width="96" height="46" rx="12" fill="#FCE5B4" stroke="#141413" stroke-width="2"/>
  <text x="620" y="233" text-anchor="middle">LLM</text>
  <use xlink:href="#robot" href="#robot" x="620" y="410" color="#B8D0C6"/>

  <!-- LLM reads the case study and the literature -->
  <g stroke="#141413" stroke-width="3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="278" y1="278" x2="500" y2="376"/>
    <line x1="258" y1="566" x2="500" y2="456"/>
  </g>

  <!-- Information gathering strategy -->
  <rect x="1190" y="200" width="500" height="46" rx="12" fill="#FCE5B4" stroke="#141413" stroke-width="2"/>
  <text x="1440" y="233" text-anchor="middle">Information gathering strategy</text>
  <use xlink:href="#robot" href="#robot" x="1440" y="410" color="#D97757"/>

  <!-- Query and answer -->
  <g stroke="#141413" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="1310" y1="384" x2="750" y2="384"/>
    <line x1="750" y1="462" x2="1310" y2="462"/>
  </g>
  <text x="1077" y="366" text-anchor="middle">Query</text>
  <text x="1077" y="444" text-anchor="middle">Answer</text>
</svg>
